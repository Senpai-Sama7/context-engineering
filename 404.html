<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Redirecting...</title>
<base href="/context-engineering/">
<script>
(function(){
  var path = window.location.pathname.replace('/context-engineering', '') || '/';
  if (path.endsWith('/') && path !== '/') {
    var idx = path.slice(1, -1);
    window.location.href = window.location.origin + '/context-engineering/' + idx;
  } else if (path !== '/') {
    var dir = path.replace(/^\//, '');
    window.location.href = window.location.origin + '/context-engineering/' + dir;
  } else {
    window.location.href = window.location.origin + '/context-engineering/';
  }
})();
</script>
</head>
<body>
<p>Redirecting...</p>
</body>
</html>
